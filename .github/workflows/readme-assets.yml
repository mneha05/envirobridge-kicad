name: Generate README animations

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/generate_readme_assets.py"
      - ".github/workflows/readme-assets.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pillow
      - run: python .github/scripts/generate_readme_assets.py
      - name: Commit generated animations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/board-tour.gif docs/i2c-flow.gif
          git diff --cached --quiet || git commit -m "docs: regenerate README animations"
          git push
